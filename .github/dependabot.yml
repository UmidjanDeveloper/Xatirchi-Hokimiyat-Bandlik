# ============================================================
#  DEPENDABOT — bog'liqliklardagi xavfsizlik yangilanishlari
#
#  Nima uchun: `npm audit` da ochiq ogohlantirishlar bor
#  (hujjat: hujjatlar/XAVFSIZLIK-QARAMLIKLAR.md). Ularni
#  qo'lda kuzatib borish unutiladi; Dependabot esa har hafta
#  o'zi PR ochadi. PR'lar avtomatik BIRLASHTIRILMAYDI: har biri
#  `Tekshiruv` oqimidan (tiplar, sinovlar, qurish) o'tadi va
#  odam ko'zidan o'tadi. Vercel preview'ida migratsiya
#  bajarilmaydi (faqat production'da) — bazaga tegmaydi.
#
#  Shovqin kam bo'lsin: kichik/patch yangilanishlar BITTA PR'ga
#  yig'iladi; ochiq PR soni cheklangan.
#
#  BARCHA MAJOR yangilanishlar avtomatik taklif QILINMAYDI: ular
#  alohida, rejalashtirilgan ish (to'liq regressiya bilan).
#  Xavfsizlik yangilanishlari esa bu `ignore` dan qat'i nazar keladi.
#
#  PR'larni o'zingiz BIRLASHTIRMASDAN oldin: bu branch production'ga
#  deploy bo'ladi. Guruhlangan PR ko'p paketni birdan yangilaydi —
#  uni xatlov paytida emas, ishdan tashqari vaqtda, CI yashil bo'lsa
#  va `npm run ci-taqlid` mahalliy o'tsa birlashtiring.
# ============================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      kichik-yangilanishlar:
        update-types: [minor, patch]
    ignore:
      # BARCHA major yangilanishlar (lucide-react 0.x -> 1.x, eslint 8 -> 10,
      # Next, React, Prisma, TypeScript, Tailwind, @types/node, ...):
      # har biri alohida rejalashtirilgan ish. Birinchi ishga tushishda
      # Dependabot shu sababli 4 ta kerakmas PR ochdi.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tashkent
    open-pull-requests-limit: 2
