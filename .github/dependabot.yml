# ============================================================
#  DEPENDABOT — bog'liqliklardagi xavfsizlik yangilanishlari
#
#  Nima uchun: `npm audit` da ochiq ogohlantirishlar bor
#  (hujjat: hujjatlar/XAVFSIZLIK-QARAMLIKLAR.md). Ularni
#  qo'lda kuzatib borish unutiladi; Dependabot esa har hafta
#  o'zi PR ochadi. PR'lar avtomatik BIRLASHTIRILMAYDI: har biri
#  `Tekshiruv` oqimidan (tiplar, sinovlar, qurish) o'tadi va
#  odam ko'zidan o'tadi. Vercel preview'ida migratsiya
#  bajarilmaydi (faqat production'da) — bazaga tegmaydi.
#
#  Shovqin kam bo'lsin: kichik/patch yangilanishlar BITTA PR'ga
#  yig'iladi; ochiq PR soni cheklangan.
#
#  MAJOR yangilanishlar (Next, React, Prisma, TypeScript,
#  Tailwind) avtomatik taklif QILINMAYDI: ular alohida,
#  rejalashtirilgan ish (to'liq regressiya bilan). Xavfsizlik
#  yangilanishlari esa bu `ignore` dan qat'i nazar keladi.
# ============================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      kichik-yangilanishlar:
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tashkent
    open-pull-requests-limit: 2
